[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoflow-graph"
version = "0.1.1"
description = "Turn an AI-generated code property graph into a beautiful, interactive dependency & data-flow map you can actually see. (Installs the `repoflow` command.)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai", "code-property-graph", "static-analysis", "dataflow", "visualization", "cytoscape"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.scripts]
repoflow = "repoflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repoflow"]

[tool.hatch.build.targets.sdist]
include = ["src/repoflow", "README.md"]
